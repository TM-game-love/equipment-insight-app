services:
  backend:
    build:
      context: ./backend
    container_name: equipment-insight-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: equipment-insight-web
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
